<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>MUSE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Nunito:wght@400;700;900&family=Oswald:wght@400;600;700&family=Marck+Script&family=IBM+Plex+Mono:wght@400;500&family=Cormorant:ital,wght@0,300;0,500;1,300&family=Yeseva+One&family=Great+Vibes&family=Unbounded:wght@300;500;600;700&family=Manrope:wght@400;500;600;700&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: numbered step bar on top; stylist screens in MUSE's own quiet UI, client screens in the stylist's chosen theme */
:root{
  --bg:#EFEBE5; --surface:#FBF9F6; --surface-2:#F4F0EA; --fg:#1F1A19; --muted:#6B625E; --line:#E0D9D0;
  --accent:#5B100D; --accent-ink:#FFEFDE; --accent-soft:#F3E3DC; --ok:#3E6B3A; --ok-soft:#E3EBDC;
  --ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --brand:"Unbounded","Manrope",sans-serif;
  --head:"Unbounded","Manrope",sans-serif; --head-w:500; --head-tr:none; --h1x:1; --logo-ls:.28em; --rad:20px;
  --c1b:var(--surface); --c1f:var(--fg); --c2b:var(--surface); --c2f:var(--fg); --c3b:var(--surface); --c3f:var(--fg); --c4b:var(--surface); --c4f:var(--fg);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161312; --surface:#1F1B1A; --surface-2:#27221F; --fg:#F1EAE2; --muted:#A89D95; --line:#3A3330;
  --accent:#E8A5C0; --accent-ink:#2A0A0B; --accent-soft:#3A2427; --ok:#A3C48F; --ok-soft:#24301F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161312; --surface:#1F1B1A; --surface-2:#27221F; --fg:#F1EAE2; --muted:#A89D95; --line:#3A3330;
  --accent:#E8A5C0; --accent-ink:#2A0A0B; --accent-soft:#3A2427; --ok:#A3C48F; --ok-soft:#24301F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button,label[class*=btn],a{cursor:pointer;touch-action:manipulation}
.skip{position:absolute;left:-9999px;top:8px;z-index:70;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px}
.skip:focus{left:max(16px,env(safe-area-inset-left,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:20px}
button.logo{background:none;border:0;padding:4px 6px;margin:-4px -6px;border-radius:10px;color:inherit;cursor:pointer;transition:transform .2s,opacity .2s}button.logo:hover{transform:scale(1.05)}button.logo:active{transform:scale(.97)}button.logo:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.logo{font-family:"Unbounded","Manrope",sans-serif;font-weight:700;letter-spacing:.06em;font-size:18px;line-height:1;white-space:nowrap;display:flex}
.logo b{font-weight:700}
:root[data-ui="muse"] .logo b:nth-child(1){color:#C9567F}:root[data-ui="muse"] .logo b:nth-child(2){color:#4F80BA}:root[data-ui="muse"] .logo b:nth-child(3){color:#B98A1C}:root[data-ui="muse"] .logo b:nth-child(4){color:#6C8147}
.steps{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{flex:none;border:0;background:transparent;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer;display:flex;gap:8px;align-items:center;white-space:nowrap;color:var(--muted)}
.step i{font-style:normal;font-family:var(--brand);font-size:10px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line)}
.step.cl i{border-style:dashed}
.step:hover{color:var(--fg)}
.step.on{background:var(--accent);color:var(--accent-ink)}
.step.on i{border-color:transparent;background:var(--accent-ink);color:var(--accent)}
.reset{flex:none;border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

main{max-width:1240px;margin:0 auto;padding-block:36px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:13px;color:var(--muted);font-weight:600}
.lead{color:var(--muted);max-width:60ch;margin:10px 0 0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 24px;flex-wrap:wrap;margin-bottom:28px}
.head h1{font-family:var(--head);font-size:calc(30px * var(--h1x));font-weight:var(--head-w);text-transform:var(--head-tr);margin-top:8px;letter-spacing:-.01em;line-height:1.05}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:26px}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px}
@media (max-width:880px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field>label,.lbl{font-size:12px;font-weight:600;color:var(--muted)}
.in{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px 14px;min-width:0}
.in:focus{border-color:var(--accent);outline:none}
textarea.in{resize:vertical;min-height:84px}
.prefix{display:flex;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;overflow:hidden}
.prefix span{padding:11px 0 11px 14px;color:var(--muted);white-space:nowrap}
.prefix input{border:0;background:transparent;padding:11px 14px 11px 2px;flex:1;min-width:0;outline:none}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 20px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:7px 13px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin:0}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.mute{background:var(--surface-2);color:var(--muted)}
.avatar-up{display:flex;gap:16px;align-items:center}
.avatar-up .ph{width:76px;height:76px;border-radius:50%;background:var(--surface-2) center/cover;border:1px dashed var(--line);flex:none;display:grid;place-items:center;font-size:11px;color:var(--muted)}

/* price editor */
.svc-list{display:flex;flex-direction:column;gap:12px}
.svc{border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr) auto;gap:14px;align-items:end;background:var(--surface)}
.svc .wide{grid-column:1/-1}
@media (max-width:800px){.svc{grid-template-columns:1fr 1fr}.svc .nm{grid-column:1/-1}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}

/* theme gallery */
.themes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.themes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tcard{border:1px solid var(--line);border-radius:18px;padding:0;cursor:pointer;background:var(--surface);text-align:left;overflow:hidden;display:flex;flex-direction:column}
.tcard.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.tprev{height:104px;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.tprev .aa{font-size:40px;line-height:1}
.tsw{display:flex;gap:4px}
.tsw span{width:18px;height:18px;border-radius:50%;border:1px solid rgba(127,127,127,.3)}
.tmeta{padding:10px 14px 12px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tmeta b{font-size:13.5px}
.tmeta span{font-size:11.5px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 16px;cursor:pointer;font-size:13px;border-radius:999px}
.seg button.on{background:var(--fg);color:var(--bg)}
.preview-wrap{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:22px;align-items:start}
@media (max-width:900px){.preview-wrap{grid-template-columns:1fr}}
.frame{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--surface)}
.frame-bar{display:flex;gap:6px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);min-width:0}
.frame-bar i{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.frame-bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:6px}

/* ===== stylist themes (each a fixed look the stylist picks) ===== */
.sf{background:var(--t-bg);color:var(--t-fg);font-family:var(--t-b);position:relative;overflow:hidden}
.sf a,.sf .lnk{color:inherit}
.sf-in{padding:26px clamp(18px,4.5vw,56px) 34px;display:flex;flex-direction:column;gap:clamp(36px,6vw,72px);position:relative}
.sf-top{display:flex;justify-content:flex-end;align-items:center;gap:12px 28px;flex-wrap:wrap;font-size:12.5px}
.sf-mark{font-family:var(--t-d);font-weight:var(--t-dw);text-transform:var(--t-tr);font-size:22px;line-height:1}
@media (max-width:520px){.sf-links{flex-wrap:nowrap!important;gap:0!important;letter-spacing:.08em!important;font-size:10.5px!important;width:100%;justify-content:space-between}.sf-links .lnk{padding:9px 8px!important}.sf-links .pill{padding:8px 12px!important}}
.sf-links{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center;font-family:var(--t-k);text-transform:uppercase;letter-spacing:.14em;font-size:11px}
.sf-links .lnk{background:none;border:0;padding:10px 14px;border-radius:999px;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;transition:background-color .2s cubic-bezier(.22,1,.36,1),color .2s}
.sf-links .lnk:not(.pill):hover,.sf-links .lnk:not(.pill):focus-visible{background:color-mix(in srgb,var(--t-fg) 10%,transparent)}
.sf-links .pill:hover,.sf-links .pill:focus-visible{background:var(--t-fg);color:var(--t-bg)}
.sf-links .pill{border:1px solid currentColor;border-radius:var(--t-btr);padding:9px 16px}
.sf-hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.85fr);gap:clamp(28px,5vw,64px);align-items:center}
@media (max-width:760px){.sf-hero{grid-template-columns:1fr}}
.sf-copy{display:flex;flex-direction:column;gap:22px;min-width:0}
.sf-kick{font-family:var(--t-k);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--t-mu)}
.sf-name{font-family:var(--t-d);font-weight:var(--t-dw);text-transform:var(--t-tr);letter-spacing:var(--t-ls);font-size:var(--t-ns);line-height:var(--t-lh);margin:0;overflow-wrap:anywhere}
.sf-bio{color:var(--t-mu);max-width:44ch;margin:0;font-size:16px;line-height:1.65}
.sf-btn{align-self:flex-start;background:var(--t-bt);color:var(--t-btf);border:0;border-radius:var(--t-btr);padding:15px 26px;cursor:pointer;font-family:var(--t-k);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.sf-btn.wide{align-self:stretch;text-align:center}
.sf-vis{position:relative;min-width:0;max-width:440px;width:100%;justify-self:center}
.ph{width:100%;aspect-ratio:4/5;max-width:100%;background-size:cover;background-position:center;position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:center;padding:16px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase}
.deco-svg{position:absolute;pointer-events:none}
.sticker{position:absolute;z-index:2;display:grid;place-items:center;text-align:center}
.bands{display:flex;flex-direction:column}
.bands div{padding:6px 18px 8px;font-family:var(--t-d);font-weight:var(--t-dw);text-transform:var(--t-tr);font-size:clamp(34px,5vw,54px);line-height:1;letter-spacing:var(--t-ls);overflow:hidden;white-space:nowrap}
.sf-sec{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--t-li);padding-bottom:12px;margin-bottom:22px}
.sf-sec h2{font-family:var(--t-d);font-weight:var(--t-dw);text-transform:var(--t-tr);letter-spacing:var(--t-ls);font-size:clamp(30px,4vw,46px);line-height:var(--t-lh)}
.sf-sec small{font-family:var(--t-k);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--t-mu)}
.sf-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.sf-card{border-radius:var(--t-rad);padding:24px 22px 22px;display:flex;flex-direction:column;gap:12px;min-height:270px}
.sf-ct{font-family:var(--t-tf);font-weight:var(--t-tw);text-transform:var(--t-tr);font-size:26px;line-height:1.05;letter-spacing:var(--t-ls)}
.sf-cd{font-size:13.5px;line-height:1.55;margin:0;flex:1;opacity:.82}
.sf-cm{font-family:var(--t-k);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.8}
.sf-price{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;font-family:var(--t-b)}
.sf-pre{font-size:12px;opacity:.75}
.sf-cbtn{align-self:flex-start;background:transparent;color:inherit;border:1.5px solid currentColor;border-radius:var(--t-btr);padding:10px 18px;cursor:pointer;font-family:var(--t-k);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.sf-list{display:flex;flex-direction:column}
.sf-li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 28px;padding:22px 0;border-bottom:1px solid var(--t-li);align-items:center}
.sf-li .sf-ct{font-size:clamp(22px,3vw,32px)}
.sf-li .sf-cd{color:var(--t-mu);opacity:1;margin-top:6px}
@media (max-width:640px){.sf-li{grid-template-columns:1fr auto}.sf-li .sf-cbtn{grid-column:1/-1}}
.sf-foot{font-family:var(--t-k);font-size:10.5px;color:var(--t-mu);letter-spacing:.16em;text-transform:uppercase;border-top:1px solid var(--t-li);padding-top:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sf-box{background:var(--t-ca);border-radius:var(--t-rad);padding:24px;border:1px solid var(--t-li);min-width:0}
.sf-bt{font-family:var(--t-tf);font-weight:var(--t-tw);text-transform:var(--t-tr);font-size:24px;line-height:1.1;margin-bottom:6px}
.sf-f{background:var(--t-bg);border:1px solid var(--t-li);color:var(--t-fg);padding:12px 14px;width:100%;min-width:0;border-radius:min(var(--t-rad),14px);font-family:var(--t-b)}
.sf-f::placeholder{color:var(--t-mu)}
.sf-lbl{font-size:12px;color:var(--t-mu)}
.story{aspect-ratio:9/16;max-width:100%;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.story .sf-in{padding:22px 18px;gap:14px;height:100%}
.story .sf-name{font-size:38px}
.story .rp{display:flex;justify-content:space-between;gap:8px;font-size:12px;border-bottom:1px solid var(--t-li);padding:7px 0}
.story .rp b{font-variant-numeric:tabular-nums;white-space:nowrap}

/* checkout, mail, cabinet */
.co{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:16px}
@media (max-width:860px){.co{grid-template-columns:1fr}}
.sum-row{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:9px 0;border-bottom:1px solid var(--t-li)}
.sum-row b{font-variant-numeric:tabular-nums}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--t-mu)}
.mail{max-width:620px;margin:0 auto}
.mail-h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.mail-h b{color:var(--fg);font-weight:600;overflow-wrap:anywhere}
.cab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.cab{grid-template-columns:1fr}}
.todo{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--t-li)}
.todo:last-child{border-bottom:0}
.todo .dot{width:26px;height:26px;border-radius:50%;border:1px solid var(--t-li);flex:none;display:grid;place-items:center;font-size:12px}
.todo.done .dot{background:var(--t-bt);color:var(--t-btf);border-color:var(--t-bt)}
.mood{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.mood figure{margin:0;display:flex;flex-direction:column;gap:5px}
.mood .tile{aspect-ratio:3/4;max-width:100%;border-radius:min(var(--t-rad,10px),12px);background-size:cover;background-position:center;border:1px solid rgba(127,127,127,.22)}
.mood figcaption{font-size:11.5px;opacity:.78}
.chat{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto;padding:4px 2px}
.msg{max-width:82%;padding:9px 13px;border-radius:16px;font-size:13.5px;overflow-wrap:anywhere}
.msg small{display:block;font-size:10.5px;opacity:.65;margin-top:3px}
.msg.me{align-self:flex-end}
.chat-in{display:flex;gap:8px;margin-top:12px}
.chat-in input{flex:1;min-width:0}
.sf .msg{background:var(--t-bg);border:1px solid var(--t-li)}
.sf .msg.me{background:var(--t-bt);color:var(--t-btf);border-color:var(--t-bt)}
.crm .msg{background:var(--surface-2)}
.crm .msg.me{background:var(--accent);color:var(--accent-ink)}
.rec{padding:14px 0;border-bottom:1px solid var(--t-li,var(--line))}
.rec:last-child{border-bottom:0}
.rec b{display:block;font-size:14.5px}
.rec p{margin:5px 0 0;font-size:13.5px;opacity:.85;white-space:pre-wrap}

/* CRM */
.crm{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:920px){.crm{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.stat b{display:block;font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.cside{display:flex;flex-direction:column;gap:10px}
.clist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.citem{display:flex;gap:12px;align-items:center;padding:13px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;width:100%}
.citem:last-child{border-bottom:0}
.citem.on{background:var(--accent-soft)}
.ava{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.citem div{min-width:0;flex:1}
.citem b{display:block;font-size:14px}

.sm-item b{display:block;font-size:15px}
.sm-item small{display:block;font-size:13px;opacity:.8}
.sm-item.on b{text-decoration:line-through;opacity:.7}
.sm-cb{width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;flex:none;font-size:13px}
.sm-item.on .sm-cb{background:var(--t-bt);color:var(--t-btf);border-color:var(--t-bt)}
.sm-avoid{margin:0;padding-left:20px;display:grid;gap:8px;font-size:16px}
.pdfmode .noprint{display:none!important}
/* pocket palette */
.pk{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.pk{grid-template-columns:1fr}}
.pk-shot,.pk-res{display:flex;flex-direction:column;gap:12px;min-width:0}
.pk-wrap{position:relative;border-radius:var(--t-rad);overflow:hidden;line-height:0}
.pk-wrap canvas{width:100%;height:auto;cursor:crosshair;display:block;touch-action:manipulation}
.pk-ring{position:absolute;width:44px;height:44px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid #FFFFFF;box-shadow:0 0 0 2px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.25);pointer-events:none}
.pk-empty{border:1.5px dashed var(--t-li);border-radius:var(--t-rad);padding:40px 22px;text-align:center}
.pk-card{display:flex;flex-direction:column;gap:10px}
.pk-split{display:flex;width:120px;height:120px;border-radius:50%;overflow:hidden;border:1px solid var(--t-li)}
.pk-split i{flex:1}
.pk-split.sm{width:42px;height:42px;flex:none}
.pk-verdict{font-family:var(--t-d);font-weight:var(--t-dw);font-size:28px;line-height:1.05}
.pk-card.yes .pk-verdict::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:#3E8E5A;margin-right:10px;vertical-align:middle}
.pk-card.near .pk-verdict::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:#D6A93A;margin-right:10px;vertical-align:middle}
.pk-card.no .pk-verdict::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:#C4424A;margin-right:10px;vertical-align:middle}
.pk-pct{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.pk-top{display:flex;gap:12px;flex-wrap:wrap;font-size:14px}
.pk-top span{display:flex;align-items:center;gap:6px}
.pk-top i{width:18px;height:18px;border-radius:50%;border:1px solid var(--t-li)}
.pk-saved{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:10px}
.pk-s{display:flex;gap:12px;align-items:center;padding:14px}
.pk-s b{display:block;font-size:15px}
.pk-s small{font-size:12.5px;opacity:.8}
/* growth + admin */
.sf-banner{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:var(--t-ca);border:1px solid var(--t-li);border-radius:var(--t-rad);padding:20px 22px}
.sf-banner b{display:block;font-family:var(--t-tf);font-weight:var(--t-tw);font-size:24px;line-height:1.1}
.sf-banner span{font-size:14px;opacity:.85}
.qz-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:10px}
.qz-o{border:1px solid var(--t-li);background:var(--t-ca);color:inherit;border-radius:var(--t-rad);padding:20px;text-align:left;font:inherit;font-size:16px;font-weight:600;cursor:pointer;min-height:84px;transition:background-color .18s,border-color .18s,transform .12s}
.qz-o:hover{border-color:var(--t-fg)}
.qz-o:active{transform:scale(.98)}
.refcard{background:var(--accent);color:var(--accent-ink);border-radius:var(--rad);padding:20px;display:flex;flex-direction:column;gap:8px}
.refcard b{font-size:17px}
.refcard p{margin:0;font-size:14px}
.refurl{font-weight:700;font-size:14px;overflow-wrap:anywhere}
/* motion moments */
.welcome{position:fixed;inset:0;z-index:65;background:#F3E9DA;color:#4A0A0E;display:grid;place-items:center;transition:opacity .45s cubic-bezier(.22,1,.36,1),visibility .45s}
.welcome.out{opacity:0;visibility:hidden}
.wl-in{display:flex;flex-direction:column;align-items:center;gap:14px;padding-inline:16px;text-align:center}
.wl-k{font-size:15px;font-weight:600;color:#6E3A3C}
.wl-w{font-family:"Unbounded",sans-serif;font-weight:700;font-size:clamp(64px,14vw,150px);line-height:.9;display:flex}
.wl-w span{display:inline-block;color:#C9567F}.wl-w span:nth-child(2){color:#4F80BA}.wl-w span:nth-child(3){color:#B98A1C}.wl-w span:nth-child(4){color:#6C8147}
.wl-n{font-family:"Unbounded",sans-serif;font-weight:600;font-size:clamp(22px,3vw,32px)}
@media (prefers-reduced-motion:no-preference){
 .wl-k{animation:wlf .5s .1s both}
 .wl-w span{animation:wlwave 1.1s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(.15s + var(--i) * 90ms)}
 .wl-n{animation:wlf .6s .75s both}
 @keyframes wlwave{0%{transform:translateY(60%) rotate(-8deg);opacity:0}55%{transform:translateY(-12%) rotate(3deg);opacity:1}100%{transform:none;opacity:1}}
 @keyframes wlf{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
 .fresh .sm-strip i{transform-origin:left;animation:smbar .6s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(.15s + var(--i) * 70ms)}
 .fresh .sm-sw span{animation:smdrop .65s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(.25s + var(--i) * 70ms)}
 .fresh .sm-sec{animation:wlf .6s cubic-bezier(.22,1,.36,1) both}
 .fresh .sm-sec:nth-of-type(2){animation-delay:.1s}.fresh .sm-sec:nth-of-type(3){animation-delay:.18s}.fresh .sm-sec:nth-of-type(4){animation-delay:.26s}
 .fresh .sm-lead,.fresh .sf-name{animation:wlf .6s cubic-bezier(.22,1,.36,1) both}
 @keyframes smbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
 @keyframes smdrop{0%{transform:translateY(-22px) rotate(-7deg);opacity:0}100%{transform:none;opacity:1}}
 .sm-item.just .sm-cb{animation:smtick .45s cubic-bezier(.34,1.56,.64,1)}
 @keyframes smtick{0%{transform:scale(.4)}100%{transform:scale(1)}}
 .pk-card.pop .pk-split i:first-child{animation:pkl .55s cubic-bezier(.22,1,.36,1) both}
 .pk-card.pop .pk-split i:last-child{animation:pkr .55s cubic-bezier(.22,1,.36,1) both}
 .pk-card.pop .pk-verdict{animation:wlf .45s .25s cubic-bezier(.22,1,.36,1) both}
 @keyframes pkl{from{transform:translateX(-100%)}to{transform:none}}
 @keyframes pkr{from{transform:translateX(100%)}to{transform:none}}
 .pk-ring{transition:left .25s cubic-bezier(.22,1,.36,1),top .25s cubic-bezier(.22,1,.36,1),background-color .25s}}
/* hover highlight on every active control (pointer devices only) */
@media (hover:hover){
 .step,.mode button,.side button,.tabs button,.seg button,.pipe button,.chip,.citem,.ditem,.ev,.setup button,.uiopt,.tcard,.bell,.pal,.mvb,.reset,.scfg,.sw,.fcur,.fopts button,.sm-sw,.sm-item,.qz-o,.slot,.pw-x,.pw-skip,.pb,.pw-pay,.sf-btn,.sf-cbtn,.lnk,.btn,.upick button,label.btn,label.sf-btn,label.sf-cbtn{transition:background-color .18s cubic-bezier(.22,1,.36,1),border-color .18s,color .18s,box-shadow .18s,filter .18s,transform .12s}
 .step:not(.on):hover,.mode button:not(.on):hover,.tabs button:not(.on):hover,.seg button:not(.on):hover,.pipe button:not(.on):hover,.ev:hover,.setup button:hover,.uiopt:hover,.mvb:not(:disabled):hover,.slot:hover{background:color-mix(in srgb,var(--fg) 8%,transparent);color:var(--fg)}
 .side button:not(.on):hover{background:color-mix(in srgb,var(--fg) 7%,transparent);color:var(--fg)}
 .citem:not(.on):hover,.ditem:not(.on):hover{background:color-mix(in srgb,var(--accent) 9%,transparent)}
 .chip:hover,.tcard:hover{border-color:var(--fg);background:color-mix(in srgb,var(--fg) 6%,transparent)}
 .btn:not(.pri):not(:disabled):hover{background:color-mix(in srgb,var(--fg) 8%,var(--surface));border-color:var(--fg)}
 .btn.pri:not(:disabled):hover,.step.on:hover,.mode button.on:hover,.side button.on:hover{filter:brightness(1.12);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
 .bell:hover,.pal:hover,.reset:hover,.scfg:hover{color:var(--fg);background:color-mix(in srgb,var(--fg) 7%,transparent);border-radius:999px}
 .sw:hover{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
 .fcur:hover,.fopts button:hover,.upick button:hover{transform:scale(1.12)}
 .sf-btn:hover,label.sf-btn:hover{filter:brightness(1.12);box-shadow:0 0 0 3px color-mix(in srgb,var(--t-bt,var(--accent)) 25%,transparent)}
 .sf-cbtn:hover,label.sf-cbtn:hover{background:color-mix(in srgb,currentColor 10%,transparent)}
 .sm-item:hover,.qz-o:hover{border-color:var(--t-fg);background:color-mix(in srgb,var(--t-fg) 6%,var(--t-ca))}
 .sm-sw:hover b{text-decoration:underline;text-underline-offset:3px}
 .pb:hover,.pw-pay:hover{filter:brightness(1.12);box-shadow:0 0 0 4px rgba(217,121,159,.35)}
 .pw-x:hover{background:#EADCC7}
 .pw-skip:hover{color:#4A0A0E}
}
.payopt{display:grid;gap:8px}
.po{display:flex;flex-direction:column;gap:3px;text-align:left;border:1.5px solid var(--t-li);background:var(--t-bg);color:var(--t-fg);border-radius:min(var(--t-rad),16px);padding:12px 14px;cursor:pointer;font:inherit}

  if(!t){r.removeAttribute("style");r.dataset.ui="neutral";return}
  const dark=lum(t.bg)<.2;const c=[...t.cards,...t.cards];
  const v={"--bg":t.bg,"--surface":t.ca,"--surface-2":mix(t.ca,t.li,.45),"--fg":t.fg,"--muted":t.mu,"--line":t.li,"--accent":t.bt,"--accent-ink":t.btf,"--accent-soft":mix(t.ca,t.bt,.14),
   "--ok":dark?"#A3C48F":"#3E6B3A","--ok-soft":dark?mix(t.ca,"#A3C48F",.18):"#E3EBDC","--ui":t.b,"--brand":t.tf||t.d,"--head":t.d,"--head-w":String(t.dw),"--head-tr":t.tr,
   "--h1x":"1","--logo-ls":".2em","--rad":t.rad==="0px"?"4px":"22px","color-scheme":dark?"dark":"light"};
  const cr=(x,y)=>{const a=lum(x),b=lum(y);return (Math.max(a,b)+.05)/(Math.min(a,b)+.05)};[0,1,2,3].forEach(i=>{const dot=cr(c[i][0],t.ca)>=1.8?c[i][0]:c[i][1];v[`--c${i+1}d`]=dot;v[`--c${i+1}b`]=c[i][0];v[`--c${i+1}f`]=c[i][1]});
  r.dataset.ui=k;r.setAttribute("style",Object.entries(v).map(([a,b])=>`${a}:${b}`).join(";"))}
function uiOpt(key,label,sub,grid){const t=T[key==="match"?S.theme:key];const on=S.ui===key;

function fold(kind,cur,act,dir,sf){const open=S.fold===kind;const ks=Object.keys(T);const oth=ks.filter(k=>k!==cur);const t=T[cur];

const lum=h=>{const n=parseInt(h.slice(1),16);const c=[n>>16,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const on=h=>{const l=lum(h);return (l+.05)/(.0118+.05)>=(1.05)/(l+.05)?"#1F1A19":"#FFFFFF"};

V.form=()=>{const c=curC();if(!c)return `<div class="panel empty">Клиентов пока нет.</div>`;const t=cth(c);const ss=secs();const i=Math.max(0,Math.min(S.fstep||0,ss.length-1));const sec=ss[i];

const hoursTo=iso=>(new Date(iso)-new Date())/36e5;
const paysOf=c=>c.pays||(c.paid>0?[{t:c.date,sum:c.paid,what:c.paid<c.total?"Предоплата":"Оплата"}]:[]);
const cancelRule=s=>(s&&s.cancel==="keep")?"Предоплата при отмене не возвращается.":"При отмене не позже, чем за сутки, предоплата возвращается.";
const RULE_MOVE="Перенести или отменить встречу можно не позже, чем за сутки до неё.";
function nextStep(c){const [n,N]=prog(c);
  if(c.cancelled)return{t:"Запись отменена",s:c.refund?`Предоплата ${rub(c.refund)} вернётся на карту в течение нескольких дней.`:"Чтобы записаться снова, выберите услугу на витрине.",btn:["go","store","Записаться снова"]};

  if(!c.photos.length)return{t:"Загрузите фото",s:"Портрет и полный рост при дневном свете, без макияжа и фильтров.",btn:["tophoto","","Загрузить фото"]};
  if(!c.meet)return{t:"Выберите время встречи",s:freeSlots().length?"Свободные окна стилиста:":"Свободных окон пока нет, стилист предложит время в чате.",slots:true};
  if(new Date(c.meet)>new Date())return{t:`Встреча ${fdt(c.meet)}`,s:"Анкета и фото у стилиста. До встречи ничего делать не нужно.",meet:true};
  if(c.total>c.paid)return{t:`Оплатите остаток ${rub(c.total-c.paid)}`,s:"Встреча прошла. Остаток можно оплатить здесь, в кабинете.",btn:["ctab","pay","Перейти к оплате"]};
  if(c.done&&c.colPub&&S.rebuyOn!==false&&svc("s5"))return{t:"Пора обновить гардероб к сезону",s:"Новые образы и список покупок на следующий сезон по вашей палитре.",btn:["rebook","","Обновить к сезону"]};
  if(c.colPub)return{t:"Ваши цвета готовы",s:"Они во вкладке «Мой стиль». Там же можно проверить цвет вещи в магазине.",btn:["ctab","style","Посмотреть цвета"]};
  return{t:"Стилист готовит рекомендации",s:"Они появятся во вкладке «Мой стиль». Мы пришлём уведомление."}}

    <div class="cancel-box"><b>Отменить запись</b><span>${esc(cancelRule(svc(c.svc)))}</span><button class="sf-cbtn" data-a="cancelmeet">${S.cancelSure===c.id?"Точно отменить?":"Отменить запись"}</button></div></div>`:""}</div>`}
V.cabinet=()=>{const c=curC();if(!c)return `<div class="panel empty">Клиентов пока нет.</div>`;const s=svc(c.svc);const t=cth(c);const tab=S.ctab||"home";if(tab==="chat"&&c.cseen!==c.chat.length){c.cseen=c.chat.length;save()}const due=c.total-c.paid;const ns=nextStep(c);
 const steps=[[c.paid>0||svc(c.svc)?.prepay!==0?"Оплата":"Запись",c.paid>0||svc(c.svc)?.prepay===0],["Анкета",c.formDone],["Фото",c.photos.length>0],["Встреча",!!c.meet&&new Date(c.meet)<new Date()],["Цвета",!!c.colPub]];
 const tabs=[["home","Главная"],["style","Мой стиль"],["chat","Чат"],["pay",due>0?`Оплата · ${rub(due)}`:"Оплата"]];let body="";
 if(tab==="home")body=noticesHTML(c)+`<div class="ns sf-box" style="background:${t.cards[0][0]};color:${t.cards[0][1]};border-color:transparent">
   <div class="sf-pre" style="opacity:.85">Следующий шаг</div><div class="ns-t">${esc(ns.t)}</div><p class="sf-cd" style="margin:0;flex:none">${esc(ns.s)}</p>
   ${ns.prog!==undefined?`<div class="ns-bar"><i style="width:${Math.round(ns.prog*100)}%"></i></div>`:""}
   ${ns.slots&&freeSlots().length?`<div class="slots-pick">${freeSlots().slice(0,6).map(x=>`<button class="ns-b ghost" data-a="pick" data-id="${x.id}">${esc(fdt(x.at))}</button>`).join("")}</div>`:""}
   ${ns.btn?`<div><button class="ns-b" data-a="${ns.btn[0]}" data-v="${ns.btn[1]}" data-t="${ns.btn[1]}">${esc(ns.btn[2])}</button></div>`:""}</div>
  <div class="cprog" aria-label="Ход работы">${steps.map(([l,d])=>`<span class="${d?"on":""}"><i aria-hidden="true">${d?"✓":""}</i>${l}</span>`).join("")}</div>
  ${meetCard(c)}${reviewForm(c)}
  ${S.modGrow&&S.grow&&S.grow.refer.on?`<div class="sf-box row" style="justify-content:space-between"><div style="min-width:0;flex:1"><div class="sf-bt" style="margin:0">Подарите подруге скидку ${S.grow.refer.friend}%</div><p class="sf-cd" style="margin:4px 0 0">Когда она запишется по вашей ссылке, вы получите ${S.grow.refer.bonus}% на следующую услугу.</p></div><button class="sf-cbtn" data-a="refcopy">Скопировать ссылку</button></div>`:""}`;
 if(tab==="style")body=`<div class="cab">
   <div class="sf-box stack"><div class="sf-bt">Ваши цвета</div>${colOf(c).length?`<div class="colc">${colOf(c).map(x=>`<span><i style="background:${x.hex}" aria-hidden="true"></i>${esc(x.name||x.hex)}</span>`).join("")}</div>${c.colNotePub?`<p class="sf-cd" style="margin:0">${esc(c.colNotePub)}</p>`:""}<div class="row"><button class="sf-btn" data-a="go" data-v="pocket">Проверить вещь в магазине</button></div>`:`<p class="sf-cd" style="margin:0">Стилист подберёт ваши цвета после консультации.</p>`}${c.maps.length?`<div class="sf-pre">Файлы от стилиста</div>${mapsHTML(c,false)}`:""}</div>
   <div class="sf-box" style="background:${t.cards[0][0]};color:${t.cards[0][1]};border-color:transparent;--t-li:rgba(127,127,127,.35)"><div class="sf-bt">Рекомендации</div>${c.recs.length?c.recs.map(r=>`<div class="rec"><b>${esc(r.t)}</b><p>${esc(r.x)}</p></div>`).join(""):`<p class="sf-cd" style="margin-top:8px">Появятся после консультации.</p>`}</div>
   <div class="sf-box stack"><div class="sf-bt">Мудборд</div>${moodHTML(c,"Стилист ещё не добавил мудборд.")}</div>
   ${rebuyCard(c)}
   <div class="sf-box stack"><div class="sf-bt">Анкета и фото</div><p class="sf-cd" style="margin:0">${c.formDone?"Анкета отправлена.":"Анкета ещё не отправлена."} Фото: ${c.photos.length}.</p><div class="row"><button class="sf-cbtn" data-a="openform">Открыть анкету</button><button class="sf-cbtn" data-a="tophoto">Добавить фото</button></div></div></div>`;
 if(tab==="chat")body=`<div class="sf-box">${chatHTML(c,"c")}<form class="chat-in" data-chat="c"><input class="sf-f" id="cm-c" placeholder="Сообщение стилисту" autocomplete="off" aria-label="Сообщение стилисту"><button class="sf-btn" type="submit">Отправить</button></form></div>`;
 if(tab==="pay")body=`<div class="cab">
   <div class="sf-box stack"><div class="sf-bt">${esc(s?.name||"Услуга")}</div>
    <div><div class="sum-row"><span>Стоимость</span><b>${rub(c.total)}</b></div><div class="sum-row"><span>Оплачено</span><b>${rub(c.paid)}</b></div><div class="sum-row"><span>Остаток</span><b>${due>0?rub(due):"0 ₽"}</b></div></div>
    ${c.cancelled?`<p class="sf-cd" style="margin:0">Запись отменена.${c.refund?` Возврат ${rub(c.refund)}.`:""}</p>`:due>0?(S.payRest===c.id?`<form class="stack" id="restform" style="gap:10px"><label class="field"><span class="sf-lbl">Номер карты</span><input class="sf-f" inputmode="numeric" value="4242 4242 4242 4242" required></label><div class="pw-2"><label class="field"><span class="sf-lbl">Срок</span><input class="sf-f" value="12/28" required></label><label class="field"><span class="sf-lbl">CVC</span><input class="sf-f" inputmode="numeric" value="123" required></label></div><button class="sf-btn wide" type="submit">Оплатить ${rub(due)}</button><p class="sf-pre" style="margin:0">Демо: оплата не проводится.</p></form>`:`<button class="sf-btn wide" data-a="payrest">Оплатить остаток ${rub(due)}</button>`):`<p class="sf-cd" style="margin:0">Всё оплачено. Спасибо!</p>`}</div>
   <div class="sf-box stack"><div class="sf-bt">История оплат</div><div>${paysOf(c).map(p=>`<div class="sum-row"><span>${esc(p.what)} · ${esc(p.t)}</span><b>${p.sum<0?"−"+rub(-p.sum):rub(p.sum)}</b></div>`).join("")||`<p class="sf-cd" style="margin:0">Оплат пока не было.</p>`}</div>
    <div class="sf-pre" style="margin-top:6px">Перенос и отмена</div><p class="sf-cd" style="margin:0">${RULE_MOVE} ${esc(cancelRule(s))}</p></div></div>`;
 return `
 <div class="head"><div><h1>Личный кабинет клиента</h1><p class="lead">Короткая главная с одним следующим шагом, остальное во вкладках.</p></div>
  ${S.clients.length>1?`<select class="in" style="width:auto" data-a2="session" aria-label="Чей кабинет показать">${S.clients.map(x=>`<option value="${x.id}" ${x.id===c.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select>`:""}</div>
 ${shell(`<div class="sf" style="${vars(t)}"><div class="sf-in" style="gap:22px">
  <div class="sf-top"><div class="cpick"><span class="sf-kick">Тема</span>${fold("cui",c.ui&&T[c.ui]?c.ui:"muse","cui","left",true)}</div></div>
  <div class="sf-copy" style="gap:6px"><div class="sf-kick">${esc(s?.name||"")} · ${esc(S.stylist.name)}</div><div class="sf-name" style="font-size:clamp(40px,6vw,76px)">${esc(c.name.split(" ")[0])}</div></div>
  <div class="ctabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" class="${tab===k?"on":""}" data-a="ctab" data-t="${k}">${l}${k==="chat"&&cUnread(c)?` <small class="cun">${cUnread(c)}</small>`:""}</button>`).join("")}</div>

V.fbuild=()=>{const ss=secs();
 return `

 <div class="stack">${ss.map((sec,si)=>`<div class="panel"><div class="card-h"><h3>${si+1}. ${esc(sec)}</h3><span>${S.form.filter(q=>q.sec===sec).length} вопр.</span></div>

 </div>`};

V.crm=()=>{const c=S.clients.find(x=>x.id===S.crmSel)||S.clients[0];const sum=S.clients.reduce((a,x)=>a+x.paid,0);const due=S.clients.reduce((a,x)=>a+(x.total-x.paid),0);
 const tab=S.crmTab==="photos"||S.crmTab==="form"||S.crmTab==="recs"||S.crmTab==="mood"||S.crmTab==="smap"||S.crmTab==="colors"?(S.crmTab==="smap"?"colors":S.crmTab):"over";let body="";
 if(c){const s=svc(c.svc);const [n,N]=prog(c);
  if(tab==="over")body=`<dl class="kv">
   <dt>Услуга</dt><dd>${esc(s?.name||"-")}</dd><dt>Оплата</dt><dd>${rub(c.paid)} из ${rub(c.total)} ${c.cancelled?`<span class="badge mute">запись отменена</span>`:c.paid>=c.total?`<span class="badge ok">оплачено</span>`:`<span class="badge">остаток ${rub(c.total-c.paid)}</span> <button class="btn ghost sm" data-a="sendpay" data-id="${c.id}">${c.payReq?"Ссылка отправлена, повторить":"Отправить ссылку на доплату"}</button>`}</dd>
   <dt>Встреча</dt><dd>${c.meet?`<b>${esc(fdt(c.meet))}</b>`:`<select class="in" style="width:auto" data-a2="assign" aria-label="Назначить встречу"><option value="">Назначить из свободных окон…</option>${freeSlots().map(s=>`<option value="${s.id}">${esc(fdt(s.at))}</option>`).join("")}</select>`}</dd>
   <dt>Анкета</dt><dd>${c.formDone?`<span class="badge ok">отправлена</span>`:`<span class="badge mute">заполняет</span>`} ${n} из ${N} ответов · <button class="btn ghost sm" data-a="tab" data-t="form">открыть</button></dd>
   <dt>Фото</dt><dd>${c.photos.length?`${c.photos.length} шт. · <button class="btn ghost sm" data-a="tab" data-t="photos">смотреть</button>`:"ещё не загружены"}</dd>
   <dt>Почта</dt><dd>${esc(c.email)}</dd><dt>Записалась</dt><dd>${esc(c.date)}</dd></dl>`;
  if(tab==="form")body=`<div class="stack" style="gap:22px">${secs().map(sec=>`<div><div class="eyebrow" style="margin-bottom:8px">${esc(sec)}</div><dl class="kv">${S.form.filter(q=>q.sec===sec).map(q=>`<dt>${esc(q.q)}</dt><dd>${q.type==="photo"?(thumbs(c,q.id)||`<span style="color:var(--muted)">нет фото</span>`):(esc(ansText(c,q))||`<span style="color:var(--muted)">нет ответа</span>`)}</dd>`).join("")}</dl></div>`).join("")}</div>`;
  if(tab==="photos"){const groups=[...S.form.filter(q=>q.type==="photo").map(q=>[q.id,q.q]),[null,"Без раздела"]];
   body=c.photos.length?`<div class="stack" style="gap:22px">${groups.map(([id,l])=>{const h=thumbs(c,id);return h?`<div><div class="eyebrow" style="margin-bottom:10px">${esc(l)}</div>${h}</div>`:""}).join("")}</div>`:`<p class="lead">Клиент ещё не загрузил фото. Они придут из анкеты.</p>`}
  if(tab==="recs")body=`<form class="stack" id="recform"><div class="field"><label for="r-t">Заголовок</label><input class="in" id="r-t" required placeholder="Например: обувь на осень"></div><div class="field"><label for="r-x">Рекомендация</label><textarea class="in" id="r-x" required placeholder="Что и почему"></textarea></div><div><button class="btn pri" type="submit">Опубликовать в кабинете</button></div></form>
   <div style="margin-top:16px">${c.recs.map((r,i)=>`<div class="rec"><div class="row" style="justify-content:space-between"><b>${esc(r.t)}</b><button class="btn ghost sm" data-a="delrec" data-i="${i}">Убрать</button></div><p>${esc(r.x)}</p></div>`).join("")||`<p class="lead">Рекомендаций пока нет.</p>`}</div>`;
  if(tab==="smap"||tab==="colors")body=colorsHTML(c);
  if(tab==="mood")body=`<div class="card-h"><h3>Файлы для клиента</h3><span>${c.maps.length?c.maps.length+" файл.":"видна клиенту в кабинете"}</span></div>
   <div class="row" style="margin-bottom:14px"><label class="btn pri" style="cursor:pointer">Загрузить файл<input type="file" accept="image/*,application/pdf" multiple data-up="map" hidden></label><span style="font-size:12.5px;color:var(--muted)">PDF или страницы картинками</span></div>
   ${mapsHTML(c,true)||`<p class="lead" style="margin:0 0 8px">Загрузите готовую карту стиля, и она появится у клиента.</p>`}
   <div class="card-h" style="margin-top:28px"><h3>Мудборд</h3></div>
   <div class="row" style="margin-bottom:16px"><label class="btn pri" style="cursor:pointer">Загрузить референсы<input type="file" accept="image/*" multiple data-up="mood" hidden></label>
   <form class="row" id="colform"><input type="color" id="col-c" value="#7A5C48" aria-label="Цвет" style="width:44px;height:42px;border:1px solid var(--line);border-radius:12px;background:none;padding:3px"><input class="in" id="col-l" placeholder="Подпись цвета" aria-label="Подпись цвета" style="width:170px"><button class="btn" type="submit">Добавить цвет</button></form></div>${moodHTML(c,"Загрузите референсы или добавьте цвета палитры.")}`;
 }
 return `
 <div class="head"><div><h1>Клиенты</h1><p class="lead">${S.clients.length} в базе, ${S.clients.filter(x=>stOf(x).who==="me").length} ждут вашего шага.</p></div></div>
 <div class="crm">
  <div class="cside"><input class="in" id="csearch" placeholder="Найти клиента" aria-label="Найти клиента" autocomplete="off">
   ${fltHTML()}<div class="clist">${cfilter(S.clients).map(x=>`<button class="citem ${c&&x.id===c.id?"on":""}" data-a="sel" data-id="${x.id}" data-nm="${esc(x.name.toLowerCase())}"><span class="ava ${hue(x)}">${esc(initials(x.name))}</span><div><b>${esc(x.name)}</b>${stLine(x)}${stBar(x)}</div>${x.unread?`<span class="badge">${x.unread} нов.</span>`:""}</button>`).join("")||`<p class="note" style="margin:8px">В этом фильтре никого.</p>`}</div></div>
  ${c?`<div class="panel"><div class="row" style="justify-content:space-between;gap:14px"><div class="row" style="gap:14px"><span class="ava ${hue(c)}" style="width:48px;height:48px">${esc(initials(c.name))}</span><div><h3 style="font-weight:700;font-size:19px">${esc(c.name)}</h3><span style="color:var(--muted);font-size:13px">${esc(svc(c.svc)?.name||"")}${c.demo?" · пример":""}</span></div></div><div class="row"><button class="btn pri sm" data-a="dlg" data-id="${c.id}">Написать${c.unread?` · ${c.unread}`:""}</button><button class="btn sm" data-a="ascl" data-id="${c.id}">Кабинет клиента</button></div></div>
   ${(()=>{const s=stOf(c);return `<div class="stepper" aria-label="Ход работы">${STEPN.map((l,i)=>`<div class="${i<s.cur?"f":i===s.cur?"c":""}"><i>${i<s.cur?"✓":i+1}</i><span>${l}</span></div>`).join("")}</div>
    <div class="now ${s.who}"><span><small>Сейчас</small>${esc(s.txt)}</span>${s.act?`<button class="btn ${s.who==="me"?"pri":""} sm" data-a="${s.act[0]}" data-t="${s.act[1]}" data-id="${c.id}">${s.act[2]}</button>`:""}${s.cur===5?`<button class="btn sm" data-a="unfinish" data-id="${c.id}">Вернуть в работу</button>`:""}</div>`})()}
   <div class="tabs" role="tablist">${[["over","Обзор"],["form","Анкета"],["photos","Фото"],["recs","Рекомендации"],["colors","Цвета"],["mood","Мудборд и файлы"]].map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" class="${tab===k?"on":""}" data-a="tab" data-t="${k}">${l}${k==="photos"&&c.photos.length?` · ${c.photos.length}`:""}${k==="recs"&&c.recs.length?` · ${c.recs.length}`:""}</button>`).join("")}</div>${body}</div>`:`<div class="panel empty">Клиентов пока нет.</div>`}
 </div>`};

const kb=n=>n>1048576?(n/1048576).toFixed(1).replace(".",",")+" МБ":Math.max(1,Math.round(n/1024))+" КБ";
function mapsHTML(c,del){if(!c.maps.length)return "";
  return `<div class="maps">${c.maps.map((m,i)=>m.pdf?`<div class="pdf"><span class="pdf-ic">PDF</span><div style="min-width:0"><b>${esc(m.name)}</b><small>${kb(m.size)} · ${esc(m.t)}</small></div>${del?`<button class="phx" style="position:static;background:transparent;color:inherit" data-a="delmap" data-i="${i}" aria-label="Удалить файл">×</button>`:""}</div>`
   :`<figure style="position:relative;margin:0"><button class="tile" data-a="lb" data-k="maps" data-c="${c.id}" data-i="${i}" style="background-image:url(${m.src});cursor:zoom-in;padding:0;width:100%" aria-label="Открыть файл"></button>${del?`<button class="phx" data-a="delmap" data-i="${i}" aria-label="Удалить страницу">×</button>`:""}<figcaption>${esc(m.name)}</figcaption></figure>`).join("")}</div>`}
const lastTxt=c=>{const m=c.chat[c.chat.length-1];return m?(m.f==="s"?"Вы: ":"")+m.x:"Сообщений пока нет"};
const QR=["Напоминаю про анкету в кабинете.","Спасибо за фото, посмотрю и вернусь с ответом.","Добавила новые рекомендации в ваш кабинет.","Предлагаю встретиться, выберите удобное окно в кабинете."];
V.dialogs=()=>{const L=[...S.clients].sort((a,b)=>(b.lastAt||0)-(a.lastAt||0));const c=cl(S.dlg)||L[0];if(c&&c.unread){c.unread=0;save()}
 return `

function shrink(file,max,cb){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);cb(cv.toDataURL("image/jpeg",.84))};img.onerror=()=>cb(r.result);img.src=r.result};r.readAsDataURL(file)}

  const h=(b,a)=>{if(!b&&!a)return 0;const v=Math.atan2(b,a)/rad;return v<0?v+360:v};const h1p=h(b1,a1p),h2p=h(b2,a2p);
  const dL=L2-L1,dC=C2p-C1p;let dh=0;if(C1p*C2p){dh=h2p-h1p;if(dh>180)dh-=360;else if(dh<-180)dh+=360}const dH=2*Math.sqrt(C1p*C2p)*Math.sin(dh*rad/2);

  const T=1-.17*Math.cos((hm-30)*rad)+.24*Math.cos(2*hm*rad)+.32*Math.cos((3*hm+6)*rad)-.2*Math.cos((4*hm-63)*rad);

function specUI(){const hx=specHex();const m=document.getElementById("specmk");if(m){m.style.left=(SPEC.h/360*100)+"%";m.style.top=((94-SPEC.l)/84*100)+"%";m.style.background=hx}const sw=document.getElementById("specsw");if(sw)sw.style.background=hx;const t=document.getElementById("spechex");if(t)t.textContent=hx.toUpperCase()}

function drawPocket(){const cv=document.getElementById("pkcv");if(!cv||!POCKET.src)return;const img=new Image();img.onload=()=>{const w=Math.min(img.width,1000);const h=img.height*w/img.width;cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);if(!POCKET.hex)pickAt(POCKET.x,POCKET.y,true)};img.src=POCKET.src}
function pickAt(x,y,rer){const cv=document.getElementById("pkcv");if(!cv)return;const g=cv.getContext("2d");const px=Math.round(x*cv.width),py=Math.round(y*cv.height),R=6;
  const d=g.getImageData(Math.max(0,px-R),Math.max(0,py-R),R*2+1,R*2+1).data;let r=0,gg=0,b=0,n=0;for(let i=0;i<d.length;i+=4){r+=d[i];gg+=d[i+1];b+=d[i+2];n++}
  const m=[r/n,gg/n,b/n];
  if(POCKET.cal){const mx=Math.max(...m),mn=Math.min(...m);if(mx<80||(mx-mn)/mx>.42){toast("Это не похоже на белый. Коснитесь белого листа или ценника");return}
   POCKET.wb=m;POCKET.cal=false;if(POCKET.raw)POCKET.hex=rgb2hex(...wbFix(POCKET.raw));POCKET.pop=true;render();toast("Свет откалиброван. Теперь коснитесь вещи");return}
  POCKET.x=x;POCKET.y=y;POCKET.raw=m;POCKET.hex=rgb2hex(...wbFix(m));POCKET.pop=true;render()}
function wbFix(m){const w=POCKET.wb;if(!w)return m;return m.map((v,i)=>Math.max(0,Math.min(255,v*Math.max(.6,Math.min(2,242/Math.max(w[i],1))))))}
async function loadLib(src){if(document.querySelector(`script[src="${src}"]`))return;await new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function exportPDF(btn){const c=curC();const doc=document.getElementById("smdoc");if(!doc)return;let dl=null;try{dl=await window.claude?.use?.("downloads")}catch(e){}
  if(!dl){toast("Скачивание PDF недоступно в этом окне. В рабочей версии файл придёт и на почту.");return}
  const old=btn.textContent;btn.textContent="Готовлю PDF…";btn.setAttribute("aria-busy","true");
  try{await loadLib("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");await loadLib("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
   doc.classList.add("pdfmode");const bg=getComputedStyle(doc.closest(".sf")).backgroundColor;
   const cv=await window.html2canvas(doc,{scale:2,backgroundColor:bg,useCORS:true,windowWidth:1100});doc.classList.remove("pdfmode");
   const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:"mm",format:"a4"});const W=210,H=297,ph=Math.floor(cv.width*H/W);
   for(let y=0,p=0;y<cv.height;y+=ph,p++){const part=document.createElement("canvas");part.width=cv.width;part.height=Math.min(ph,cv.height-y);const g=part.getContext("2d");g.fillStyle=bg;g.fillRect(0,0,part.width,part.height);g.drawImage(cv,0,-y);if(p)pdf.addPage();pdf.addImage(part.toDataURL("image/jpeg",.92),"JPEG",0,0,W,part.height*W/part.width)}
   await dl.save({filename:`Style Map ${c.name}.pdf`,data:pdf.output("blob")});toast("PDF сохранён")}
  catch(e){doc.classList.remove("pdfmode");if(e&&e.code==="declined")toast("Сохранение отменено");else toast("Не получилось собрать PDF. Попробуйте ещё раз.")}
  finally{if(btn.isConnected){btn.textContent=old;btn.removeAttribute("aria-busy")}}}

  const label=k=>new Date(Math.floor(k/12),k%12,1).toLocaleDateString("ru-RU",{month:"short"}).replace(".","");

   <div class="bars" role="img" aria-label="Доход за последние 6 месяцев: ${ks.map((k,i)=>`${label(k)} ${rub(sums[i])}`).join(", ")}">${ks.map((k,i)=>`<div class="bcol" title="${label(k)}: ${rub(sums[i])}"><span class="bval">${sums[i]?rub(sums[i]):"0"}</span><div class="btrack"><i style="height:${Math.max(sums[i]?4:0,Math.round(sums[i]/max*100))}%"></i></div><span class="blab">${label(k)}</span></div>`).join("")}</div></div>`}
async function exportCSV(btn){let dl=null;try{dl=await window.claude?.use?.("downloads")}catch(e){}if(!dl){toast("Скачивание недоступно в этом окне");return}
  const q=v=>`"${String(v).replace(/"/g,'""')}"`;const csv="﻿"+["Дата;Клиент;Услуга;Операция;Сумма, ₽"].concat(payRows().map(r=>[r.t,r.name,r.svc,r.what,r.sum].map(q).join(";"))).join("\r\n");
  try{await dl.save({filename:"MUSE оплаты.csv",data:csv});toast("Таблица сохранена")}catch(e){toast(e&&e.code==="declined"?"Сохранение отменено":"Не получилось сохранить таблицу")}}

/* ---------- repeat sale ---------- */
const rebuyCard=c=>(S.rebuyOn!==false&&c.colPub&&svc("s5"))?`<div class="sf-box stack"><div class="sf-bt" style="margin:0">Пора обновить гардероб к сезону</div><p class="sf-cd" style="margin:0;flex:none">${esc(svc("s5").desc)}</p><div class="row" style="justify-content:space-between"><b>${rub(svc("s5").price)}</b><button class="sf-btn" data-a="rebook">Обновить к сезону</button></div></div>`:"";
const rebuyHTML=()=>`<div class="panel"><div class="toggle"><span><b style="display:block">Повторные продажи</b><span style="font-size:13px;color:var(--muted)">После рекомендаций клиент видит в кабинете предложение «${esc(svc("s5")?.name||"Обновление к сезону")}» с оплатой в одно касание</span></span><button class="sw ${S.rebuyOn!==false?"on":""}" data-a="rebuysw" role="switch" aria-checked="${S.rebuyOn!==false}" aria-label="Повторные продажи"></button></div></div>`;

/* ---------- bottom nav (phone) ---------- */
function bnavHTML(){const cm=isClient(S.view)||S.view==="admin";if(cm)return "";const U=S.clients.reduce((a,c)=>a+(c.unread||0),0);const L=todo().length;
  const I={home:'<path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1Z"/>',crm:'<circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21 20c0-2.6-1.6-4.8-4-5.6"/>',dialogs:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/>',schedule:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>',more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>'};
  const it=[["home","Главная",L],["crm","Клиенты",0],["dialogs","Диалоги",U],["schedule","Расписание",0]];const inMore=!it.some(x=>x[0]===S.view);
  const more=[["money","Финансы"],["vitrina","Витрина"],...(S.modGrow?[["quiz","Тест"],["refer","Рефералы"]]:[]),["help","Инструкция"]];
  return `${S.bmore?`<div class="bsheet" role="menu">${more.map(([k,l])=>`<button role="menuitem" class="${S.view===k?"on":""}" data-a="bgo" data-v="${k}">${l}</button>`).join("")}</div>`:""}
   <nav class="bnav" aria-label="Разделы">${it.map(([k,l,n])=>`<button class="${S.view===k?"on":""}" data-a="bgo" data-v="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[k]}</svg><span>${l}</span>${n?`<b>${n}</b>`:""}</button>`).join("")}<button class="${inMore||S.bmore?"on":""}" data-a="bmore" aria-expanded="${!!S.bmore}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">${I.more}</svg><span>Ещё</span></button></nav>`}

/* ---------- events ---------- */
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
  if(a==="demoload"){loadDemo();save();go("crm");toast("Добавлены примеры клиентов. Убрать можно одной кнопкой")}
  if(a==="demodel"){removeDemo();save();render();toast("Примеры убраны")}
  if(a==="remsw"){S.autoRemind=S.autoRemind===false;save();render()}
  if(a==="revstar"){S.revDraft={c:curC().id,r:+b.dataset.i};render()}
  if(a==="revshow"){const r=S.reviews.find(x=>x.id===b.dataset.id);r.show=!r.show;save();render();toast(r.show?"Отзыв показан на витрине":"Отзыв скрыт с витрины")}
  if(a==="workdel"){S.works=S.works.filter(w=>w.id!==b.dataset.id);save();render()}
  if(a==="cflt"){S.cflt=b.dataset.k;save();render()}
  if(a==="csv")exportCSV(b);
  if(a==="rebook"){const c=curC();S.rebook=c.id;S.cart="s5";S.payFull=false;go("checkout")}
  if(a==="pcfull"){const c=PC();c.full=!c.full;if(!c.full)S.payFull=false;save();render()}
  if(a==="pcdisc"){const c=PC();if(!c.full)return;c.discOn=!c.discOn;if(c.discOn&&!(+c.disc>0))c.disc=7;save();render()}
  if(a==="pcset"){PC().disc=+b.dataset.v;save();render()}
  if(a==="wlcsv"){(async()=>{let dl=null;try{dl=await window.claude?.use?.("downloads")}catch(e){}const rows=[["Имя","Почта","Интересы","Дата"],...wlGet().map(x=>[x.name,x.email,x.want.join("; "),x.t])];const csv="\ufeff"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\n");if(!dl){toast("Скачивание недоступно в этом окне");return}await dl.save({filename:"MUSE лист ожидания.csv",data:new Blob([csv],{type:"text/csv"})});toast("CSV сохранён")})()}
  if(a==="rebuysw"){S.rebuyOn=S.rebuyOn===false;save();render()}
  if(a==="bmore"){S.bmore=!S.bmore;render()}
  if(a==="bgo"){S.bmore=false;go(b.dataset.v)}
});
document.addEventListener("submit",e=>{const f=e.target;
  if(f.id==="revform"){e.preventDefault();const c=curC();const r=S.revDraft&&S.revDraft.c===c.id?S.revDraft.r:0;if(!r)return;S.reviews=S.reviews||[];S.reviews.unshift({id:uid(),cid:c.id,name:c.name.split(" ")[0]+" "+(c.name.split(" ")[1]||"")[0]+".",rating:r,text:document.getElementById("rv-t").value.trim()||"Спасибо!",t:now(),consent:document.getElementById("rv-ok").checked,show:false});c.reviewed=true;S.revDraft=null;ev(`${c.name} оставила отзыв: ${r} из 5`,c.id);save();render();toast("Спасибо за отзыв!")}
  if(f.id==="workform"){e.preventDefault();const d=S.wdraft||{};S.works=S.works||[];S.works.unshift({id:uid(),title:document.getElementById("w-t").value.trim(),text:document.getElementById("w-x").value.trim(),b:d.b||null,a:d.a||null});S.wdraft=null;save();render();toast("Работа добавлена и видна на витрине")}
});
document.addEventListener("change",e=>{const t=e.target;if((t.dataset.up==="wb"||t.dataset.up==="wa")&&t.files[0]){shrink(t.files[0],900,u=>{S.wdraft=S.wdraft||{};S.wdraft[t.dataset.up==="wb"?"b":"a"]=u;render()})}});

if(svc("s5"))svc("s5").repeat=true;
if(!S.s5Added){if(!svc("s5"))S.services.push({id:"s5",name:"Обновление к сезону",price:8000,dur:"онлайн",prepay:100,repeat:true,desc:"Новые образы и список покупок на сезон по вашей палитре.",inc:["Образы","Список покупок"]});S.s5Added=true}
if(!S.reviews)S.reviews=hasDemo()?demoReviews():[];
const _crm=V.crm;V.crm=()=>S.clients.length?_crm().replace('<div class="crm">',demoBar()+'<div class="crm">'):emptyCrm();

document.addEventListener("click",e=>{if(S.bmore&&!e.target.closest(".bsheet,.bnav")){S.bmore=false;render()}},true);
let drag=null;
document.addEventListener("dragstart",e=>{const el=e.target.closest&&e.target.closest("[data-drag]");if(!el)return;drag={l:el.dataset.drag,k:el.dataset.key};el.classList.add("dragging");try{e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",drag.k)}catch(err){}});
document.addEventListener("dragover",e=>{if(!drag)return;const el=e.target.closest("[data-drag]");if(!el||el.dataset.drag!==drag.l)return;e.preventDefault();document.querySelectorAll(".dropto").forEach(x=>x.classList.remove("dropto"));if(el.dataset.key!==drag.k)el.classList.add("dropto")});
document.addEventListener("drop",e=>{if(!drag)return;const el=e.target.closest("[data-drag]");if(el&&el.dataset.drag===drag.l){e.preventDefault();moveTo(drag.l,drag.k,el.dataset.key);save()}drag=null;render()});

runAuto();
render();
(function(){const sp=document.getElementById("splash");if(!sp)return;let gone=false;
  const hide=()=>{if(gone)return;gone=true;sp.classList.add("out");setTimeout(()=>sp.remove(),600)};
